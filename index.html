<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Météo Maison</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1a2140">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Météo">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root {
    --bg-top: #1a2140;
    --bg-bottom: #402a63;
    --card-bg: rgba(255,255,255,0.07);
    --card-border: rgba(255,255,255,0.12);
    --text: #f2f3fb;
    --text-dim: #a7acc9;
    --accent-humidity: #56ccf2;
    --accent-pressure: #9b8cff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    color: var(--text);
    overscroll-behavior: none;
  }
  body {
    min-height: 100dvh;
    padding: max(24px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  body.sheet-open { overflow: hidden; }
  header { text-align: center; margin-bottom: 4px; }
  header h1 { font-size: 1.3rem; margin: 0 0 4px; font-weight: 600; letter-spacing: 0.02em; }
  header p { margin: 0; color: var(--text-dim); font-size: 0.8rem; }
  .cards { display: flex; flex-direction: column; gap: 14px; flex: 1; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 18px 20px;
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
    position: relative;
  }
  .card:active { transform: scale(0.98); background: rgba(255,255,255,0.11); }
  .card::after {
    content: "›";
    position: absolute;
    top: 14px; right: 16px;
    color: var(--text-dim);
    font-size: 1.3rem;
    line-height: 1;
    opacity: 0.5;
  }
  .card .label { font-size: 0.82rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; }
  .card .value { font-size: 2.4rem; font-weight: 700; line-height: 1; margin-top: 6px; }
  .card .unit { font-size: 1.1rem; font-weight: 400; color: var(--text-dim); margin-left: 4px; }
  .ring { position: relative; width: 84px; height: 84px; flex-shrink: 0; }
  .ring svg { transform: rotate(-90deg); width: 100%; height: 100%; }
  .ring circle { fill: none; stroke-width: 8; }
  .ring .bg { stroke: rgba(255,255,255,0.1); }
  .ring .fg { stroke-linecap: round; transition: stroke-dasharray 0.6s ease; }
  .pressure-row { flex-direction: column; align-items: stretch; }
  .pressure-top { display: flex; justify-content: space-between; align-items: baseline; padding-right: 22px; }
  canvas#chart { width: 100%; height: 70px; margin-top: 8px; }
  footer { text-align: center; color: var(--text-dim); font-size: 0.72rem; padding-top: 4px; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #6fcf97; margin-right: 5px; }
  .dot.offline { background: #eb5757; }
  .refresh-hint { text-align: center; color: var(--text-dim); font-size: 0.7rem; }

  /* ---- Bottom sheet historique ---- */
  .backdrop {
    position: fixed; inset: 0;
    background: rgba(8, 10, 24, 0.6);
    backdrop-filter: blur(3px);
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 10;
  }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: linear-gradient(180deg, #262e54 0%, #1c2244 100%);
    border-radius: 24px 24px 0 0;
    border-top: 1px solid rgba(255,255,255,0.14);
    padding: 10px 20px max(24px, env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
    z-index: 11;
    max-height: 88dvh;
    overflow-y: auto;
  }
  .sheet.open { transform: translateY(0); }
  .grabber {
    width: 40px; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,0.25);
    margin: 4px auto 14px;
  }
  .sheet-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 16px; }
  .sheet-head .label { font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; }
  .sheet-head .value { font-size: 2.1rem; font-weight: 700; line-height: 1.1; margin-top: 4px; }
  .sheet-head .unit { font-size: 1rem; font-weight: 400; color: var(--text-dim); margin-left: 3px; }
  .close-btn {
    background: rgba(255,255,255,0.1); border: none; color: var(--text);
    width: 32px; height: 32px; border-radius: 50%;
    font-size: 1.1rem; line-height: 1; cursor: pointer;
  }
  .ranges { display: flex; gap: 8px; margin-bottom: 14px; }
  .ranges button {
    flex: 1;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-dim);
    padding: 8px 0; border-radius: 12px;
    font-size: 0.82rem; font-family: inherit; cursor: pointer;
    transition: all 0.15s ease;
  }
  .ranges button.active { background: rgba(255,255,255,0.18); color: var(--text); border-color: rgba(255,255,255,0.28); }
  .chart-wrap { position: relative; }
  canvas#detailChart { width: 100%; height: 190px; display: block; touch-action: none; cursor: crosshair; }
  .tooltip {
    position: absolute;
    pointer-events: none;
    background: rgba(10, 13, 32, 0.94);
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 10px;
    padding: 6px 10px;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.12s ease;
    transform: translate(-50%, -118%);
    z-index: 2;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  .tooltip.show { opacity: 1; }
  .tooltip .tv { font-weight: 700; font-size: 0.95rem; line-height: 1.1; }
  .tooltip .tt { color: var(--text-dim); font-size: 0.68rem; margin-top: 2px; }
  .chart-hint {
    text-align: center; color: var(--text-dim); font-size: 0.68rem;
    margin-top: 6px; transition: opacity 0.3s ease;
  }
  .chart-hint.hidden { opacity: 0; }
  .stats { display: flex; gap: 10px; margin-top: 16px; }
  .stat {
    flex: 1; text-align: center;
    background: rgba(255,255,255,0.06);
    border-radius: 14px; padding: 10px 4px;
  }
  .stat .k { font-size: 0.68rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
  .stat .v { font-size: 1.05rem; font-weight: 600; margin-top: 3px; }
  .sheet-msg { text-align: center; color: var(--text-dim); font-size: 0.85rem; padding: 30px 0; }
</style>
</head>
<body>

<header>
  <h1>🏠 Météo Maison</h1>
  <p><span class="dot" id="statusDot"></span><span id="statusText">Chargement…</span></p>
</header>

<div class="cards">

  <div class="card" data-metric="temperature">
    <div>
      <div class="label">Température</div>
      <div class="value" id="tempValue">--<span class="unit">°C</span></div>
    </div>
    <div class="ring">
      <svg viewBox="0 0 84 84">
        <circle class="bg" cx="42" cy="42" r="36"></circle>
        <circle class="fg" id="tempRing" cx="42" cy="42" r="36" stroke="#eb5757"></circle>
      </svg>
    </div>
  </div>

  <div class="card" data-metric="humidite">
    <div>
      <div class="label">Humidité</div>
      <div class="value" id="humValue">--<span class="unit">%</span></div>
    </div>
    <div class="ring">
      <svg viewBox="0 0 84 84">
        <circle class="bg" cx="42" cy="42" r="36"></circle>
        <circle class="fg" id="humRing" cx="42" cy="42" r="36" stroke="var(--accent-humidity)"></circle>
      </svg>
    </div>
  </div>

  <div class="card pressure-row" data-metric="pression">
    <div class="pressure-top">
      <div>
        <div class="label">Pression</div>
        <div class="value" id="presValue">--<span class="unit">hPa</span></div>
      </div>
      <div class="label" id="presTrend">--</div>
    </div>
    <canvas id="chart"></canvas>
  </div>

</div>

<p class="refresh-hint" id="lastUpdate">--</p>

<footer>Données via Adafruit IO &middot; ESP32-C3</footer>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet">
  <div class="grabber"></div>
  <div class="sheet-head">
    <div>
      <div class="label" id="sheetLabel">--</div>
      <div class="value" id="sheetValue">--</div>
    </div>
    <button class="close-btn" id="closeBtn" aria-label="Fermer">✕</button>
  </div>
  <div class="ranges" id="ranges"></div>
  <div class="chart-wrap">
    <canvas id="detailChart"></canvas>
    <div class="tooltip" id="tooltip"></div>
  </div>
  <div class="chart-hint" id="chartHint">Touche le graphique pour explorer</div>
  <div class="stats">
    <div class="stat"><div class="k">Min</div><div class="v" id="statMin">--</div></div>
    <div class="stat"><div class="k">Moyenne</div><div class="v" id="statAvg">--</div></div>
    <div class="stat"><div class="k">Max</div><div class="v" id="statMax">--</div></div>
  </div>
  <div class="sheet-msg" id="sheetMsg" style="display:none"></div>
</div>

<script>
const USERNAME = "latruite73";
const REFRESH_MS = 60000;
const RING_CIRCUMFERENCE = 2 * Math.PI * 36;
const TEMP_MIN = 0, TEMP_MAX = 40;

const METRICS = {
  temperature: { label: "Température", unit: "°C", color: "#eb5757", decimals: 1 },
  humidite:    { label: "Humidité",    unit: "%",  color: "#56ccf2", decimals: 0 },
  pression:    { label: "Pression",    unit: "hPa", color: "#9b8cff", decimals: 1 },
};

const RANGES = [
  { label: "6 h",  hours: 6,   resolution: 5 },
  { label: "24 h", hours: 24,  resolution: 30 },
  { label: "7 j",  hours: 168, resolution: 120 },
];

/* ---------- API ---------- */

async function fetchLast(feed) {
  const res = await fetch(`https://io.adafruit.com/api/v2/${USERNAME}/feeds/${feed}/data?limit=1`);
  if (!res.ok) throw new Error(`${feed}: ${res.status}`);
  const data = await res.json();
  return data[0];
}

async function fetchChart(feed, hours, resolution) {
  const res = await fetch(
    `https://io.adafruit.com/api/v2/${USERNAME}/feeds/${feed}/data/chart?hours=${hours}&resolution=${resolution}`
  );
  if (!res.ok) throw new Error(`${feed}: ${res.status}`);
  const json = await res.json();
  return (json.data || [])
    .map(([date, value]) => ({ t: new Date(date), v: parseFloat(value) }))
    .filter((p) => !isNaN(p.v));
}

/* ---------- Rendu graphique ---------- */

function prepCanvas(canvas) {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, rect.width, rect.height);
  return { ctx, w: rect.width, h: rect.height };
}

function drawSparkline(canvas, points, color) {
  const { ctx, w, h } = prepCanvas(canvas);
  const values = points.map((p) => p.v);
  if (values.length < 2) return;
  const min = Math.min(...values), max = Math.max(...values);
  const pad = (max - min) * 0.15 || 1;
  const lo = min - pad, hi = max + pad;

  ctx.beginPath();
  values.forEach((v, i) => {
    const x = (i / (values.length - 1)) * w;
    const y = h - ((v - lo) / (hi - lo)) * h;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.5;
  ctx.lineJoin = "round";
  ctx.stroke();

  ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath();
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, color + "59");
  grad.addColorStop(1, color + "00");
  ctx.fillStyle = grad;
  ctx.fill();
}

function drawDetailChart() {
  if (!chartState) return;
  const { points, meta, hours } = chartState;
  const canvas = document.getElementById("detailChart");
  const { ctx, w, h } = prepCanvas(canvas);
  if (points.length < 2) return;

  const padL = 42, padR = 8, padT = 10, padB = 22;
  const plotW = w - padL - padR, plotH = h - padT - padB;

  const values = points.map((p) => p.v);
  const min = Math.min(...values), max = Math.max(...values);
  const pad = (max - min) * 0.15 || 1;
  const lo = min - pad, hi = max + pad;

  const xAt = (i) => padL + (i / (points.length - 1)) * plotW;
  const yAt = (v) => padT + plotH - ((v - lo) / (hi - lo)) * plotH;

  chartState.geom = { padL, padT, plotW, plotH, lo, hi };

  // grille + labels Y
  ctx.font = "10px -apple-system, sans-serif";
  ctx.fillStyle = "#a7acc9";
  ctx.textAlign = "right";
  ctx.textBaseline = "middle";
  for (let i = 0; i <= 3; i++) {
    const v = lo + ((hi - lo) * i) / 3;
    const y = yAt(v);
    ctx.strokeStyle = "rgba(255,255,255,0.07)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padL, y); ctx.lineTo(w - padR, y);
    ctx.stroke();
    ctx.fillText(v.toFixed(meta.decimals), padL - 6, y);
  }

  // labels X
  ctx.textAlign = "center";
  ctx.textBaseline = "top";
  const fmt = hours > 48
    ? (d) => d.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit" })
    : (d) => d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  [0, Math.floor((points.length - 1) / 2), points.length - 1].forEach((i) => {
    ctx.fillText(fmt(points[i].t), xAt(i), padT + plotH + 6);
  });

  // aire
  ctx.beginPath();
  points.forEach((p, i) => (i === 0 ? ctx.moveTo(xAt(i), yAt(p.v)) : ctx.lineTo(xAt(i), yAt(p.v))));
  ctx.lineTo(xAt(points.length - 1), padT + plotH);
  ctx.lineTo(xAt(0), padT + plotH);
  ctx.closePath();
  const grad = ctx.createLinearGradient(0, padT, 0, padT + plotH);
  grad.addColorStop(0, meta.color + "4d");
  grad.addColorStop(1, meta.color + "00");
  ctx.fillStyle = grad;
  ctx.fill();

  // ligne
  ctx.beginPath();
  points.forEach((p, i) => (i === 0 ? ctx.moveTo(xAt(i), yAt(p.v)) : ctx.lineTo(xAt(i), yAt(p.v))));
  ctx.strokeStyle = meta.color;
  ctx.lineWidth = 2.5;
  ctx.lineJoin = "round";
  ctx.stroke();

  // point final
  const lastX = xAt(points.length - 1), lastY = yAt(points[points.length - 1].v);
  ctx.beginPath();
  ctx.arc(lastX, lastY, 4, 0, Math.PI * 2);
  ctx.fillStyle = meta.color;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(lastX, lastY, 7, 0, Math.PI * 2);
  ctx.fillStyle = meta.color + "40";
  ctx.fill();

  // curseur d'exploration
  if (hoverIndex !== null && hoverIndex >= 0 && hoverIndex < points.length) {
    const hx = xAt(hoverIndex), hy = yAt(points[hoverIndex].v);
    ctx.save();
    ctx.setLineDash([3, 4]);
    ctx.strokeStyle = "rgba(255,255,255,0.45)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(hx, padT);
    ctx.lineTo(hx, padT + plotH);
    ctx.stroke();
    ctx.restore();

    ctx.beginPath();
    ctx.arc(hx, hy, 9, 0, Math.PI * 2);
    ctx.fillStyle = meta.color + "38";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(hx, hy, 5.5, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(hx, hy, 3, 0, Math.PI * 2);
    ctx.fillStyle = meta.color;
    ctx.fill();
  }
}

/* ---------- Bottom sheet ---------- */

let currentMetric = null;
let currentRange = 0; // 6 h par défaut
let chartState = null;
let hoverIndex = null;

function buildRangeButtons() {
  const box = document.getElementById("ranges");
  box.innerHTML = "";
  RANGES.forEach((r, i) => {
    const btn = document.createElement("button");
    btn.textContent = r.label;
    btn.className = i === currentRange ? "active" : "";
    btn.addEventListener("click", () => {
      currentRange = i;
      [...box.children].forEach((c, ci) => c.classList.toggle("active", ci === i));
      loadSheetData();
    });
    box.appendChild(btn);
  });
}

async function loadSheetData() {
  const meta = METRICS[currentMetric];
  const range = RANGES[currentRange];
  const canvas = document.getElementById("detailChart");
  const msg = document.getElementById("sheetMsg");

  msg.style.display = "none";
  hoverIndex = null;
  hideTooltip();
  try {
    const points = await fetchChart(currentMetric, range.hours, range.resolution);
    if (points.length < 2) {
      chartState = null;
      prepCanvas(canvas);
      document.getElementById("chartHint").style.display = "none";
      msg.textContent = "Pas encore assez de données sur cette période.";
      msg.style.display = "block";
      ["statMin", "statAvg", "statMax"].forEach((id) => (document.getElementById(id).textContent = "--"));
      return;
    }
    document.getElementById("chartHint").style.display = "";
    chartState = { points, meta, hours: range.hours };
    drawDetailChart();

    const vals = points.map((p) => p.v);
    const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
    const f = (v) => v.toFixed(meta.decimals) + " " + meta.unit;
    document.getElementById("statMin").textContent = f(Math.min(...vals));
    document.getElementById("statAvg").textContent = f(avg);
    document.getElementById("statMax").textContent = f(Math.max(...vals));
  } catch (err) {
    console.error(err);
    chartState = null;
    prepCanvas(canvas);
    document.getElementById("chartHint").style.display = "none";
    msg.textContent = "Impossible de charger l'historique.";
    msg.style.display = "block";
  }
}

/* ---------- Exploration du graphique ---------- */

function hideTooltip() {
  document.getElementById("tooltip").classList.remove("show");
}

function fmtPointTime(d, hours) {
  const time = d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  if (hours <= 24) return time;
  return d.toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" }) + " · " + time;
}

function scrub(clientX) {
  if (!chartState || !chartState.geom) return;
  const canvas = document.getElementById("detailChart");
  const rect = canvas.getBoundingClientRect();
  const { padL, padT, plotW, plotH, lo, hi } = chartState.geom;
  const { points, meta, hours } = chartState;

  const x = clientX - rect.left;
  let i = Math.round(((x - padL) / plotW) * (points.length - 1));
  i = Math.max(0, Math.min(points.length - 1, i));
  if (i === hoverIndex) return;
  hoverIndex = i;
  drawDetailChart();

  const p = points[i];
  const px = padL + (i / (points.length - 1)) * plotW;
  const py = padT + plotH - ((p.v - lo) / (hi - lo)) * plotH;

  const tip = document.getElementById("tooltip");
  tip.innerHTML =
    `<div class="tv" style="color:${meta.color}">${p.v.toFixed(meta.decimals)} ${meta.unit}</div>` +
    `<div class="tt">${fmtPointTime(p.t, hours)}</div>`;
  tip.classList.add("show");
  // garde l'infobulle dans les limites du graphique
  const half = tip.offsetWidth / 2;
  tip.style.left = Math.max(half + 2, Math.min(rect.width - half - 2, px)) + "px";
  tip.style.top = Math.max(tip.offsetHeight + 4, py) + "px";

  document.getElementById("chartHint").classList.add("hidden");
}

(function setupScrub() {
  const canvas = document.getElementById("detailChart");
  let active = false;
  canvas.addEventListener("pointerdown", (e) => {
    active = true;
    canvas.setPointerCapture(e.pointerId);
    scrub(e.clientX);
  });
  canvas.addEventListener("pointermove", (e) => {
    if (active || e.pointerType === "mouse") scrub(e.clientX);
  });
  canvas.addEventListener("pointerup", (e) => {
    active = false;
    try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
  });
  canvas.addEventListener("pointercancel", () => { active = false; });
  canvas.addEventListener("pointerleave", (e) => {
    if (e.pointerType === "mouse" && !active) {
      hoverIndex = null;
      hideTooltip();
      drawDetailChart();
    }
  });
})();

function openSheet(metric) {
  currentMetric = metric;
  const meta = METRICS[metric];
  document.getElementById("sheetLabel").textContent = meta.label;

  const liveEl = { temperature: "tempValue", humidite: "humValue", pression: "presValue" }[metric];
  document.getElementById("sheetValue").innerHTML = document.getElementById(liveEl).innerHTML;

  buildRangeButtons();
  document.getElementById("backdrop").classList.add("open");
  document.getElementById("sheet").classList.add("open");
  document.body.classList.add("sheet-open");
  // laisse le sheet se positionner avant de mesurer le canvas
  setTimeout(loadSheetData, 80);
}

function closeSheet() {
  document.getElementById("backdrop").classList.remove("open");
  document.getElementById("sheet").classList.remove("open");
  document.body.classList.remove("sheet-open");
  currentMetric = null;
  hoverIndex = null;
  chartState = null;
  hideTooltip();
}

document.querySelectorAll(".card").forEach((card) => {
  card.addEventListener("click", () => openSheet(card.dataset.metric));
});
document.getElementById("backdrop").addEventListener("click", closeSheet);
document.getElementById("closeBtn").addEventListener("click", closeSheet);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

/* ---------- Boucle principale ---------- */

async function refresh() {
  try {
    const [temp, hum, pres, presHistory] = await Promise.all([
      fetchLast("temperature"),
      fetchLast("humidite"),
      fetchLast("pression"),
      fetchChart("pression", 6, 5),
    ]);

    const tempVal = parseFloat(temp.value);
    const humVal = parseFloat(hum.value);
    const presVal = parseFloat(pres.value);

    document.getElementById("tempValue").innerHTML = `${tempVal.toFixed(1)}<span class="unit">°C</span>`;
    document.getElementById("humValue").innerHTML = `${humVal.toFixed(0)}<span class="unit">%</span>`;
    document.getElementById("presValue").innerHTML = `${presVal.toFixed(0)}<span class="unit">hPa</span>`;

    setRing(document.getElementById("tempRing"), (tempVal - TEMP_MIN) / (TEMP_MAX - TEMP_MIN),
      tempVal >= 25 ? "#eb5757" : tempVal <= 15 ? "#56ccf2" : "#f2c94c");
    setRing(document.getElementById("humRing"), humVal / 100, "#56ccf2");

    if (presHistory.length >= 2) {
      const delta = presHistory[presHistory.length - 1].v - presHistory[0].v;
      document.getElementById("presTrend").textContent =
        delta > 0.5 ? `↗ +${delta.toFixed(1)}` : delta < -0.5 ? `↘ ${delta.toFixed(1)}` : "→ stable";
      drawSparkline(document.getElementById("chart"), presHistory, METRICS.pression.color);
    }

    document.getElementById("statusDot").classList.remove("offline");
    document.getElementById("statusText").textContent = "En ligne";
    document.getElementById("lastUpdate").textContent =
      "Mis à jour à " + new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });

    if (currentMetric) {
      document.getElementById("sheetValue").innerHTML =
        document.getElementById({ temperature: "tempValue", humidite: "humValue", pression: "presValue" }[currentMetric]).innerHTML;
    }
  } catch (err) {
    document.getElementById("statusDot").classList.add("offline");
    document.getElementById("statusText").textContent = "Hors ligne / erreur";
    console.error(err);
  }
}

function setRing(el, pct, color) {
  const clamped = Math.max(0, Math.min(1, pct));
  el.setAttribute("stroke-dasharray", `${RING_CIRCUMFERENCE * clamped} ${RING_CIRCUMFERENCE}`);
  if (color) el.setAttribute("stroke", color);
}

refresh();
setInterval(refresh, REFRESH_MS);

window.addEventListener("resize", () => {
  if (currentMetric) loadSheetData();
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("service-worker.js"));
}
</script>
